services:
  postgres:
    image: postgres:16-alpine
    container_name: test-benchmark-postgres-dev
    environment:
      POSTGRES_DB: test_benchmark
      POSTGRES_USER: test_benchmark
      POSTGRES_PASSWORD: test_benchmark
    ports:
      - "${TEST_BENCHMARK_DB_HOST_PORT:-18112}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_benchmark -d test_benchmark"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: python:3.11-slim
    container_name: test-benchmark-backend-dev
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://test_benchmark:test_benchmark@postgres:5432/test_benchmark
      BENCHMARK_DATA_DIR: /data/benchmarks
      TEST_BENCHMARK_AUTH_PASSWORD: ${TEST_BENCHMARK_AUTH_PASSWORD:-12345}
      TEST_BENCHMARK_AUTH_SECRET: ${TEST_BENCHMARK_AUTH_SECRET:-test-benchmark-local-secret}
      PORT: "8000"
    ports:
      - "${TEST_BENCHMARK_BACKEND_HOST_PORT:-18111}:8000"
    volumes:
      - ./backend:/app
      - ./data/benchmarks:/data/benchmarks:ro
      - benchmark-storage:/storage
      - backend-pip-cache:/root/.cache/pip
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    container_name: test-benchmark-frontend-dev
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${TEST_BENCHMARK_WEB_HOST_PORT:-18110}:18110"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  benchmark-storage:
  backend-pip-cache:
  frontend-node-modules:
