services:
  web:
    image: python:3.11-slim
    container_name: test-benchmark-web-dev
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      PORT: "8000"
    ports:
      - "${TEST_BENCHMARK_WEB_HOST_PORT:-18110}:8000"
    volumes:
      - ./backend:/app
      - web-pip-cache:/root/.cache/pip
    restart: unless-stopped

volumes:
  web-pip-cache:
