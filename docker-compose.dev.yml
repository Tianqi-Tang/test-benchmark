services:
  backend:
    image: python:3.11-slim
    container_name: test-benchmark-backend-dev
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      PORT: "8000"
    ports:
      - "${TEST_BENCHMARK_BACKEND_HOST_PORT:-18111}:8000"
    volumes:
      - ./backend:/app
      - backend-pip-cache:/root/.cache/pip
    restart: unless-stopped

  frontend:
    image: node:24-alpine
    container_name: test-benchmark-frontend-dev
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${TEST_BENCHMARK_WEB_HOST_PORT:-18110}:18110"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-pip-cache:
  frontend-node-modules:
