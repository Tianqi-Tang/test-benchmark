<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>test-benchmark</title>
    <link rel="stylesheet" href="static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div>
          <p class="eyebrow">Medical Model Evaluation</p>
          <h1>test-benchmark</h1>
          <p class="summary">医疗文本模型和多模态模型评测环境</p>
        </div>
        <div class="status" aria-label="service status">
          <span class="dot"></span>
          <span>测试环境待接入</span>
        </div>
      </section>

      <section class="grid" aria-label="candidate models">
        <article>
          <h2>通用文本模型</h2>
          <ul>
            <li>AntAngelMed（安诊儿）</li>
            <li>DeepSeek-v4-pro</li>
            <li>qwen3.7-plus</li>
            <li>gpt-5.5</li>
            <li>Gemini-3.5-flash</li>
          </ul>
        </article>
        <article>
          <h2>多模态模型</h2>
          <ul>
            <li>qwen3.7-plus</li>
            <li>gpt-5.5</li>
            <li>Gemini-3.5-flash</li>
          </ul>
        </article>
      </section>
    </main>
  </body>
</html>
