name: CI and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_HOST: 20.2.81.240
  DEPLOY_USER: azureuser
  DEPLOY_PATH: /home/azureuser/test-benchmark

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.31"

      - name: Install dependencies
        run: uv pip install --system -r backend/requirements.txt

      - name: Run tests
        run: pytest -q backend/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          VITE_BASE_PATH=/test-benchmark/ pnpm build
        working-directory: frontend

      - name: Build Docker image
        run: |
          docker build -t test-benchmark-backend:${{ github.sha }} -f backend/Dockerfile .
          docker build -t test-benchmark-frontend:${{ github.sha }} -f frontend/Dockerfile .

  deploy:
    name: Deploy Test Environment
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Prepare deploy directory
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

      - name: Validate deploy secrets
        run: |
          test -n "${{ secrets.TEST_BENCHMARK_AUTH_PASSWORD }}"
          test -n "${{ secrets.TEST_BENCHMARK_AUTH_SECRET }}"

      - name: Upload project
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".idea/" \
            --exclude ".DS_Store" \
            --exclude "data/" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Write deploy environment
        env:
          TEST_BENCHMARK_AUTH_PASSWORD: ${{ secrets.TEST_BENCHMARK_AUTH_PASSWORD }}
          TEST_BENCHMARK_AUTH_SECRET: ${{ secrets.TEST_BENCHMARK_AUTH_SECRET }}
        run: |
          {
            printf 'TEST_BENCHMARK_AUTH_PASSWORD=%s\n' "$TEST_BENCHMARK_AUTH_PASSWORD"
            printf 'TEST_BENCHMARK_AUTH_SECRET=%s\n' "$TEST_BENCHMARK_AUTH_SECRET"
          } > /tmp/test-benchmark.env
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key" \
            /tmp/test-benchmark.env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env"

      - name: Restart service
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose up -d --build --remove-orphans"

      - name: Attach service to proxy network
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker network inspect healthbot-proxy >/dev/null 2>&1 || docker network create healthbot-proxy"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker network connect healthbot-proxy test-benchmark-frontend >/dev/null 2>&1 || true"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker network connect healthbot-proxy test-benchmark-backend >/dev/null 2>&1 || true"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "curl -fsS http://localhost:18111/health && curl -fsS http://localhost:18110/ && curl -fsS http://localhost/test-benchmark/api/health"
